services:
  frontend:
    build:
      context: ./frontend
    container_name: taskflow-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: taskflow-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      MONGO_URI: mongodb://mongoserver:27017/taskflow
      REDIS_HOST: redisserver
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_QUEUE_KEY: taskflow:queue:solicitudes
      REDIS_EVENTS_CHANNEL: taskflow:eventos
      REDIS_HEARTBEAT_KEY: taskflow:worker:heartbeat
      HEARTBEAT_TTL_SECONDS: 30
      CORS_ORIGIN: http://localhost:80,http://localhost:5173,http://localhost
    depends_on:
      - mongoserver
      - redisserver
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    container_name: taskflow-worker
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongoserver:27017/taskflow
      REDIS_HOST: redisserver
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_QUEUE_KEY: taskflow:queue:solicitudes
      CANAL_EVENTOS: taskflow:eventos
      CACHE_PREFIX: taskflow
      REDIS_HEARTBEAT_KEY: taskflow:worker:heartbeat
      HEARTBEAT_WORKER_TTL: 30
    depends_on:
      - mongoserver
      - redisserver
    restart: unless-stopped

  mongoserver:
    image: mongo:6.0
    container_name: taskflow-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: taskflow
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redisserver:
    image: redis:7-alpine
    container_name: taskflow-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
